name: Scheduled Actors

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-actors
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run due schedules
        run: npm run scheduled

      - name: Upload scheduled datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-output/
          if-no-files-found: ignore
          retention-days: 30
